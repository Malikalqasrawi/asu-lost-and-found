name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  backend:
    name: Backend lint, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:layers
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Integration tests (PostgreSQL in Docker)
        run: npm run test:e2e

  mobile:
    name: Mobile lint, type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:layers
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - name: Create a throwaway .env (random values, used only in this run)
        run: |
          {
            echo "DB_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "DB_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "SERIAL_HASH_KEY=$(openssl rand -base64 48 | tr -d '\n')"
          } > .env

      - name: Build the images and start the stack
        run: docker compose up -d --build

      - name: Wait until the API answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health; then
              echo
              echo "API is up"
              exit 0
            fi
            sleep 3
          done
          echo "The API didn't start."
          docker compose logs
          exit 1

      - name: Stop and delete everything
        if: always()
        run: docker compose down -v
