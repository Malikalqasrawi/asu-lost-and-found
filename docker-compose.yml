services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lostfound
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Copy .env.example to .env and set DB_ADMIN_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Copy .env.example to .env and set DB_APP_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/create-roles.sh:/docker-entrypoint-initdb.d/create-roles.sh:ro
    ports:
      # This machine only, for running the backend or Prisma Studio outside Docker.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lostfound"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends; open http://localhost:8027 to read them.
  # Point the MAIL_* settings in .env at a real SMTP server to deliver them instead.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8027:8025"
      # SMTP, for a backend started with npm run start:dev.
      - "127.0.0.1:1027:1025"

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      MIGRATION_DATABASE_URL: postgresql://lostfound:${DB_PASSWORD}@db:5432/lostfound
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    # A last line of defence: if photo processing ever runs away, Docker restarts
    # the backend instead of the whole machine running out of memory.
    mem_limit: 768m
    environment:
      DATABASE_URL: postgresql://lostfound_app:${DB_APP_PASSWORD}@db:5432/lostfound
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      SERIAL_HASH_KEY: ${SERIAL_HASH_KEY:?Copy .env.example to .env and set SERIAL_HASH_KEY}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-asu.edu.jo}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-ASU Lost & Found <no-reply@asu-lost-found.local>}"
      RATE_LIMIT_EMAILS_PER_HOUR: ${RATE_LIMIT_EMAILS_PER_HOUR:-10}
      RATE_LIMIT_LOGINS_PER_15_MIN: ${RATE_LIMIT_LOGINS_PER_15_MIN:-10}
      RATE_LIMIT_UPLOADS_PER_MINUTE: ${RATE_LIMIT_UPLOADS_PER_MINUTE:-5}
      ADMIN_SITE_ORIGIN: ${ADMIN_SITE_ORIGIN:-http://localhost:4001}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_BIND:-127.0.0.1}:4000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${ADMIN_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    environment:
      API_ORIGIN: ${ADMIN_API_ORIGIN:-http://localhost:4000}
    ports:
      - "127.0.0.1:4001:8080"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
